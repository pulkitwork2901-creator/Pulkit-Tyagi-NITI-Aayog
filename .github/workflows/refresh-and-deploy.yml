# Rebuilds the board's data every day from official sources and the manual sheet,
# then publishes the site to GitHub Pages. Also runs when you push a change
# to data/manual-indicators.csv, or on demand from the Actions tab.
name: Refresh data and deploy board

on:
  schedule:
    - cron: "30 12 * * *"   # 18:00 IST daily, after most releases
  push:
    branches: [main]
    paths: ["data/**", "public/data/trade/**", "src/**", "scripts/**", "index.html", "reform.html", "package.json", "vite.config.js", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      trade_release:
        description: "Optional DGCI&S release folder under data/trade/raw/"
        required: false
        type: string
      trade_period:
        description: "Optional exact DGCI&S period label, for example 2026 Jan-Aug"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'board-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Pull new RBI releases (services trade, remittances, balance of payments)
        run: python scripts/rbi_releases.py
        continue-on-error: true   # keeps data/rbi_releases.json as it was if RBI's site is unreachable

      - name: Pull the Indian basket crude price (PPAC)
        run: python scripts/ppac_crude.py
        continue-on-error: true   # keeps data/ppac_crude.json as it was if PPAC is unreachable

      - name: Pull new GST revenue reports (GSTN)
        run: python scripts/gst_reports.py
        continue-on-error: true   # keeps data/gst_reports.json as it was

      - name: Read CBDT's direct tax time series (newest PDF in data/uploads/direct-taxes/)
        run: python scripts/direct_taxes.py
        continue-on-error: true   # keeps data/direct_taxes.json as it was if a new PDF fails its checks

      - name: Pull MoSPI data and merge the manual sheet
        run: python scripts/build_indicators.py
        continue-on-error: true   # keeps last good GDP/CPI if MoSPI is down

      - name: Pull data for the Reform Evidence Board (World Bank, NJDG, IBBI, CPGRAMS, MSME, regulators)
        run: python scripts/build_reform.py
        continue-on-error: true   # keeps the last good copy of any source that fails
        timeout-minutes: 10       # a source that hangs must not hold up the rest of the board (normally under a minute)

      - name: Validate and build DGCI&S trade data
        env:
          TRADE_RELEASE: ${{ inputs.trade_release }}
          TRADE_PERIOD: ${{ inputs.trade_period }}
        run: |
          if [ -n "$TRADE_RELEASE" ]; then
            if [ -n "$TRADE_PERIOD" ]; then
              python scripts/trade_pipeline.py --release-dir "$TRADE_RELEASE" --period "$TRADE_PERIOD"
            else
              python scripts/trade_pipeline.py --release-dir "$TRADE_RELEASE"
            fi
          elif find data/trade/raw -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            python scripts/trade_pipeline.py
          else
            echo "No committed DGCI&S release snapshot; keeping existing trade JSON."
          fi

      - name: Save refreshed data back to the repo
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add public/data/indicators.json public/data/indicators.csv data/rbi_releases.json data/ppac_crude.json data/gst_reports.json data/direct_taxes.json public/data/direct-taxes.json public/data/reform/evidence.json data/reform/njdg-snapshots.csv data/reform/msme-snapshots.csv public/data/trade
          git diff --cached --quiet || git commit -m "Refresh indicators $(date -u +%F)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Relative paths: the site works at any address, so renaming the
          # repository (which changes the Pages URL) cannot break it.
          BASE_PATH: ./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
